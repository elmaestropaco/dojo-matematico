name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Firebase config
        shell: bash
        run: |
          cat > firebase-config.js <<'EOF'
          window.NINJA_FIREBASE_CONFIG = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ vars.FIREBASE_AUTH_DOMAIN }}",
            databaseURL: "${{ vars.FIREBASE_DATABASE_URL }}",
            projectId: "${{ vars.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ vars.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ vars.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ vars.FIREBASE_APP_ID }}",
            measurementId: "${{ vars.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public files only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html *.js *.css _site/
          cp -R assets banco-problemas _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Wait for artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GH_TOKEN, PAGES_ARTIFACT_NAME } = process.env;
          const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100`;
          let ready = false;
          for (let attempt = 1; attempt <= 18; attempt++) {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' }
            });
            if (!response.ok) throw new Error(`Artifact metadata request failed: HTTP ${response.status}`);
            const result = await response.json();
            ready = result.artifacts.some(artifact => artifact.name === PAGES_ARTIFACT_NAME && !artifact.expired);
            if (ready) { console.log('Pages artifact is available.'); break; }
            console.log(`Waiting for Pages artifact metadata (${attempt}/18).`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!ready) throw new Error('Pages artifact is still unavailable after waiting.');
          NODE

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Allow artifact service propagation
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
